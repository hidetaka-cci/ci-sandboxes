# =============================================================
# Smarter Testing / Dynamic Test Splitting 検証用 CircleCI config
# =============================================================
#
# 検証ステップ:
#   1. circleci testsuite doctor "ci tests"（全チェック pass）
#   2. feature/dts-verify-p1 … parallelism=1（ベースライン）
#   3. feature/dts-verify-static … parallelism=4, 静的分割
#   4. feature/dts-verify-dynamic … parallelism=4 + dynamic-test-splitting
#   5. feature/dts-verify-dynamic 再実行 … 学習フェーズ比較
#   6. feature/dts-verify-invalid … doctor 失敗確認（p1 + dynamic）
#
version: 2.1

executors:
  node22-small:
    docker:
      - image: cimg/node:22.16
    resource_class: small

commands:
  install-deps:
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  doctor:
    executor: node22-small
    steps:
      - install-deps
      - run:
          name: Validate test suite configuration
          command: circleci testsuite doctor "ci tests"

  test-p1:
    executor: node22-small
    steps:
      - install-deps
      - run:
          name: Run tests (parallelism=1 baseline)
          command: circleci testsuite run "ci tests" --analyze-tests=none
      - store_test_results:
          path: test-reports

  test-static:
    executor: node22-small
    parallelism: 4
    steps:
      - install-deps
      - run:
          name: Run tests (static split, parallelism=4)
          command: circleci testsuite run "ci tests" --analyze-tests=none
      - store_test_results:
          path: test-reports

  test-dynamic:
    executor: node22-small
    parallelism: 4
    steps:
      - install-deps
      - run:
          name: Run tests (dynamic split, parallelism=4)
          command: circleci testsuite run "ci tests" --analyze-tests=none
      - store_test_results:
          path: test-reports

workflows:
  dts-verify-setup:
    jobs:
      - doctor:
          filters:
            branches:
              only:
                - feature/dts-verify-setup
                - feature/dts-verify-invalid

  dts-verify-p1:
    jobs:
      - doctor:
          filters:
            branches:
              only: feature/dts-verify-p1
      - test-p1:
          requires:
            - doctor
          filters:
            branches:
              only: feature/dts-verify-p1

  dts-verify-static:
    jobs:
      - doctor:
          filters:
            branches:
              only: feature/dts-verify-static
      - test-static:
          requires:
            - doctor
          filters:
            branches:
              only: feature/dts-verify-static

  dts-verify-dynamic:
    jobs:
      - doctor:
          filters:
            branches:
              only: feature/dts-verify-dynamic
      - test-dynamic:
          requires:
            - doctor
          filters:
            branches:
              only: feature/dts-verify-dynamic
