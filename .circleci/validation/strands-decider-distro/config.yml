# Strands Decider 2B 配布方式比較 + 確信度検証
# Pipeline definition から参照。main の .circleci/config.yml は変更しない。
version: 2.1

parameters:
  phase:
    type: enum
    enum: ["step0", "prepare", "measure", "confidence", "cases"]
    default: "step0"
    description: "step0 / prepare=Cキャッシュ / measure=A/C / confidence / cases=高確信度ケース"
  include_b:
    type: boolean
    default: false
    description: "B(独自イメージ)は難しいと判断済み。再挑戦する場合のみ true"

executors:
  python-xlarge:
    docker:
      - image: cimg/python:3.12
    resource_class: xlarge
    working_directory: ~/project
    environment:
      VENV_DIR: /home/circleci/venv
      HF_HOME: /home/circleci/.cache/huggingface
      HF_HUB_CACHE: /home/circleci/.cache/huggingface/hub
      TRANSFORMERS_CACHE: /home/circleci/.cache/huggingface/hub
      BENCH_OUT: /home/circleci/project/bench-out

  # Method C / confidence: pinned weights only, no Hub traffic at infer time.
  python-xlarge-offline:
    docker:
      - image: cimg/python:3.12
    resource_class: xlarge
    working_directory: ~/project
    environment:
      VENV_DIR: /home/circleci/venv
      HF_HOME: /home/circleci/.cache/huggingface
      HF_HUB_CACHE: /home/circleci/.cache/huggingface/hub
      TRANSFORMERS_CACHE: /home/circleci/.cache/huggingface/hub
      BENCH_OUT: /home/circleci/project/bench-out
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

  baked-xlarge:
    docker:
      - image: ttl.sh/hidetaka-cci-strands-decider-bench:7d
    resource_class: xlarge
    working_directory: ~/project
    environment:
      VENV_DIR: /opt/venv
      HF_HOME: /opt/hf-cache
      HF_HUB_CACHE: /opt/hf-cache/hub
      TRANSFORMERS_CACHE: /opt/hf-cache/hub
      BENCH_OUT: /home/circleci/project/bench-out
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

commands:
  install-cpu-deps:
    steps:
      - run:
          name: Install CPU torch + strands-decider
          no_output_timeout: 30m
          command: bash validation/strands-decider-distro/scripts/install_cpu.sh

  run-timed-bench:
    parameters:
      method:
        type: string
    steps:
      - run:
          name: Run timed bench (<< parameters.method >>)
          no_output_timeout: 45m
          environment:
            METHOD: << parameters.method >>
          command: |
            set -euo pipefail
            set -a
            # shellcheck disable=SC1091
            source validation/strands-decider-distro/versions.env
            set +a
            export PATH="${VENV_DIR}/bin:${PATH}"
            mkdir -p "${BENCH_OUT}"
            python validation/strands-decider-distro/scripts/run_bench.py
      - store_artifacts:
          path: bench-out

jobs:
  step0-preflight:
    executor: python-xlarge
    steps:
      - checkout
      - install-cpu-deps
      - run:
          name: Step 0 — peak memory + offline revision pin
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            export PATH="${VENV_DIR}/bin:${PATH}"
            mkdir -p "${BENCH_OUT}"
            python validation/strands-decider-distro/scripts/step0_preflight.py
      - store_artifacts:
          path: bench-out

  prepare-cache-c:
    executor: python-xlarge
    steps:
      - checkout
      - restore_cache:
          keys:
            - strands-decider-cache-{{ checksum "validation/strands-decider-distro/versions.env" }}
      - install-cpu-deps
      - run:
          name: Prefetch Hugging Face caches (not timed)
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            export PATH="${VENV_DIR}/bin:${PATH}"
            python validation/strands-decider-distro/scripts/prefetch_models.py
            du -sh "${HF_HOME}" "${VENV_DIR}" || true
      - save_cache:
          key: strands-decider-cache-{{ checksum "validation/strands-decider-distro/versions.env" }}
          paths:
            - /home/circleci/venv
            - /home/circleci/.cache/huggingface

  prepare-image-b:
    docker:
      - image: cimg/base:stable
    resource_class: xlarge
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build and push baked image to ttl.sh (DLC on; not timed for comparison)
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            # shellcheck disable=SC1091
            source validation/strands-decider-distro/versions.env
            IMAGE="${B_IMAGE_REPO}:${B_IMAGE_TAG}"
            echo "Building ${IMAGE}"
            docker build \
              --build-arg STRANDS_DECIDER_VERSION="${STRANDS_DECIDER_VERSION}" \
              --build-arg DECIDER_HUB_ID="${DECIDER_HUB_ID}" \
              --build-arg BASE_MODEL_ID="${BASE_MODEL_ID}" \
              --build-arg BASE_MODEL_REVISION="${BASE_MODEL_REVISION}" \
              -t "${IMAGE}" \
              -f validation/strands-decider-distro/docker/Dockerfile \
              validation/strands-decider-distro/docker
            docker push "${IMAGE}"
            docker image ls "${IMAGE}"

  measure-a:
    executor: python-xlarge
    steps:
      - checkout
      - run:
          name: Ensure cold HF cache (baseline A)
          command: rm -rf "${HF_HOME}" || true
      - install-cpu-deps
      - run-timed-bench:
          method: A

  measure-b:
    executor: baked-xlarge
    steps:
      - checkout
      - run:
          name: Verify baked model dirs are present
          command: |
            set -euo pipefail
            echo "VENV_DIR=${VENV_DIR}"
            du -sh /opt/models "${VENV_DIR}"
            test -f /opt/models/DECIDER_LOCAL_PATH
            test -d /opt/models/decider
            test -d /opt/models/base
            test -x "${VENV_DIR}/bin/python"
            BASE_BYTES=$(du -sb /opt/models/base | awk '{print $1}')
            echo "base_bytes=${BASE_BYTES}"
            test "${BASE_BYTES}" -ge 2000000000
      - run-timed-bench:
          method: B

  measure-c:
    executor: python-xlarge-offline
    steps:
      - checkout
      - restore_cache:
          keys:
            - strands-decider-cache-{{ checksum "validation/strands-decider-distro/versions.env" }}
      - run:
          name: Verify restored venv + offline pin
          command: |
            set -euo pipefail
            test -x "${VENV_DIR}/bin/python"
            export PATH="${VENV_DIR}/bin:${PATH}"
            python -c "import strands_decider; print(strands_decider.__version__)"
            test "${HF_HUB_OFFLINE}" = "1"
            test "${TRANSFORMERS_OFFLINE}" = "1"
            # shellcheck disable=SC1091
            set -a
            source validation/strands-decider-distro/versions.env
            set +a
            test -f "${HF_HOME}/hub/models--StrandsAgents--strands-decider-2B-hobson-v19/refs/main"
            test "$(cat "${HF_HOME}/hub/models--StrandsAgents--strands-decider-2B-hobson-v19/refs/main")" = "${DECIDER_REVISION}"
            test "$(cat "${HF_HOME}/hub/models--Qwen--Qwen3.5-2B-Base/refs/main")" = "${BASE_MODEL_REVISION}"
      - run-timed-bench:
          method: C

  confidence-c:
    executor: python-xlarge-offline
    steps:
      - checkout
      - restore_cache:
          keys:
            - strands-decider-cache-{{ checksum "validation/strands-decider-distro/versions.env" }}
      - run:
          name: Verify restored venv + offline pin
          command: |
            set -euo pipefail
            test -x "${VENV_DIR}/bin/python"
            export PATH="${VENV_DIR}/bin:${PATH}"
            test "${HF_HUB_OFFLINE}" = "1"
            # shellcheck disable=SC1091
            set -a
            source validation/strands-decider-distro/versions.env
            set +a
            test "$(cat "${HF_HOME}/hub/models--StrandsAgents--strands-decider-2B-hobson-v19/refs/main")" = "${DECIDER_REVISION}"
      - run:
          name: Confidence rate on real PR diffs
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            set -a
            # shellcheck disable=SC1091
            source validation/strands-decider-distro/versions.env
            set +a
            export PATH="${VENV_DIR}/bin:${PATH}"
            mkdir -p "${BENCH_OUT}"
            python validation/strands-decider-distro/scripts/run_confidence.py
      - store_artifacts:
          path: bench-out

  high-conf-cases:
    executor: python-xlarge-offline
    steps:
      - checkout
      - restore_cache:
          keys:
            - strands-decider-cache-{{ checksum "validation/strands-decider-distro/versions.env" }}
      - run:
          name: Verify restored venv + offline pin
          command: |
            set -euo pipefail
            test -x "${VENV_DIR}/bin/python"
            export PATH="${VENV_DIR}/bin:${PATH}"
            test "${HF_HUB_OFFLINE}" = "1"
            set -a
            # shellcheck disable=SC1091
            source validation/strands-decider-distro/versions.env
            set +a
            test "$(cat "${HF_HOME}/hub/models--StrandsAgents--strands-decider-2B-hobson-v19/refs/main")" = "${DECIDER_REVISION}"
      - run:
          name: Run designed high-confidence cases
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            set -a
            # shellcheck disable=SC1091
            source validation/strands-decider-distro/versions.env
            set +a
            export PATH="${VENV_DIR}/bin:${PATH}"
            mkdir -p "${BENCH_OUT}"
            python validation/strands-decider-distro/scripts/run_high_conf_cases.py
      - store_artifacts:
          path: bench-out

workflows:
  step0:
    when:
      equal: [step0, << pipeline.parameters.phase >>]
    jobs:
      - step0-preflight

  prepare:
    when:
      equal: [prepare, << pipeline.parameters.phase >>]
    jobs:
      - prepare-cache-c

  prepare-b-opt-in:
    when:
      and:
        - equal: [prepare, << pipeline.parameters.phase >>]
        - equal: [true, << pipeline.parameters.include_b >>]
    jobs:
      - prepare-image-b

  measure:
    when:
      equal: [measure, << pipeline.parameters.phase >>]
    jobs:
      - measure-a
      - measure-c

  measure-b-opt-in:
    when:
      and:
        - equal: [measure, << pipeline.parameters.phase >>]
        - equal: [true, << pipeline.parameters.include_b >>]
    jobs:
      - measure-b

  confidence:
    when:
      equal: [confidence, << pipeline.parameters.phase >>]
    jobs:
      - confidence-c

  cases:
    when:
      equal: [cases, << pipeline.parameters.phase >>]
    jobs:
      - high-conf-cases
