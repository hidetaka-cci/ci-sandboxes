name: ci-sandboxes test

on:
  push:
    branches: [main, cursor/gha-yaml-verify-77c8]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: Verify marker
        run: echo "GHA workflow executed on CircleCI infrastructure"
