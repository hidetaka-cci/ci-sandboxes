name: sensor-min
on:
  push:
    branches: [cursor/cicd-sensor-rerun-a806]
  workflow_dispatch:
jobs:
  min:
    runs-on: ubuntu-latest
    env:
      RUNNER_TRACKING_ID: github_circleci-manual-test
    steps:
      - run: echo "GITHUB_RUN_ID=${{ github.run_number }}" >> "$GITHUB_ENV"
      - uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38
        with:
          enable-html-report: false
          enable-attestation-artifact: false
      - id: curl
        continue-on-error: true
        run: curl -fsS https://example.com -o /dev/null
      - if: always()
        run: |
          echo "curl outcome=${{ steps.curl.outcome }}"
          sudo journalctl -u cicd-sensor-agent --no-pager | tail -80
